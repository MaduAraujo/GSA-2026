version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-jsx-a11y doesn't support ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node types must match the runtime (Node 22/24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
