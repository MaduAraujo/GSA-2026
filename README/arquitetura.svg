<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Roboto, Arial, sans-serif">
  <title>Arquitetura do Hub GSA 2026</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <g transform="translate(0,40)">
    <rect x="30" y="170" width="190" height="150" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="125" y="208" font-size="15" font-weight="500" fill="#202124" text-anchor="middle">Navegador (PWA)</text>
    <g font-size="12" fill="#5f6368" text-anchor="middle">
      <text x="125" y="236">React + TanStack Query</text>
      <text x="125" y="272">Service worker:</text>
      <text x="125" y="290">cache offline e push</text>
    </g>

    <rect x="320" y="30" width="290" height="330" rx="16" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
    <text x="336" y="54" font-size="13" font-weight="500" fill="#202124">Vercel</text>
    <rect x="340" y="70" width="250" height="60" rx="10" fill="#ffffff" stroke="#dadce0"/>
    <text x="465" y="95" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">Front estático</text>
    <text x="465" y="114" font-size="12" fill="#5f6368" text-anchor="middle">SPA, PWA e cabeçalhos de segurança</text>
    <rect x="340" y="160" width="250" height="110" rx="10" fill="#ffffff" stroke="#dadce0"/>
    <text x="465" y="190" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">API Express</text>
    <text x="465" y="210" font-size="12" fill="#5f6368" text-anchor="middle">Vercel Function · validação Zod</text>
    <text x="465" y="238" font-size="12" fill="#5f6368" text-anchor="middle">/ai · /portfolio · /push · /cron</text>
    <rect x="340" y="300" width="250" height="44" rx="10" fill="#ffffff" stroke="#dadce0"/>
    <text x="465" y="327" font-size="12" fill="#202124" text-anchor="middle">Cron diário · aviso de inatividade</text>

    <rect x="680" y="30" width="250" height="330" rx="16" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
    <text x="696" y="54" font-size="13" font-weight="500" fill="#202124">Supabase</text>
    <rect x="700" y="70" width="210" height="60" rx="10" fill="#ffffff" stroke="#dadce0"/>
    <text x="805" y="95" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">Auth</text>
    <text x="805" y="114" font-size="12" fill="#5f6368" text-anchor="middle">e-mail e senha ou Google</text>
    <rect x="700" y="150" width="210" height="80" rx="10" fill="#ffffff" stroke="#dadce0"/>
    <text x="805" y="176" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">PostgreSQL</text>
    <text x="805" y="196" font-size="12" fill="#5f6368" text-anchor="middle">RLS por usuário</text>
    <text x="805" y="214" font-size="12" fill="#5f6368" text-anchor="middle">limite de uso da IA</text>
    <rect x="700" y="250" width="210" height="60" rx="10" fill="#ffffff" stroke="#dadce0"/>
    <text x="805" y="275" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">Storage</text>
    <text x="805" y="294" font-size="12" fill="#5f6368" text-anchor="middle">certificados, fotos e vídeos</text>

    <rect x="680" y="400" width="250" height="64" rx="14" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="805" y="427" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">Groq</text>
    <text x="805" y="447" font-size="12" fill="#5f6368" text-anchor="middle">modelos de texto e de visão</text>

    <g fill="none" stroke="#5f6368" stroke-width="1.5" marker-end="url(#seta)">
      <path d="M125,170 V-10 H805 V28"/>
      <path d="M220,200 H265 V100 H338"/>
      <path d="M220,240 H295 V200 H338"/>
      <path d="M465,300 V272"/>
      <path d="M590,200 H678"/>
      <path d="M590,240 H640 V432 H678"/>
      <path d="M340,255 H222" stroke-dasharray="5 4"/>
    </g>
    <g font-size="11" fill="#5f6368" text-anchor="middle">
      <text x="465" y="-16">dados, login e arquivos · HTTPS + JWT do usuário</text>
      <text x="302" y="92">HTTPS</text>
      <text x="256" y="232">/api + JWT</text>
      <text x="270" y="270">Web Push</text>
      <text x="645" y="192">service_role</text>
      <text x="659" y="424">IA</text>
    </g>

    <g font-size="11" fill="#5f6368">
      <line x1="30" y1="420" x2="62" y2="420" stroke="#5f6368" stroke-width="1.5"/>
      <text x="70" y="424">requisição</text>
      <line x1="30" y1="444" x2="62" y2="444" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="70" y="448">notificação push</text>
    </g>
  </g>
</svg>
