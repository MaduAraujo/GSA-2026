<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2a75e8" />
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#d32f2f" />
    </linearGradient>
    <linearGradient id="gYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="#FFFFFF" />
  
  <!-- Outer Google Accent Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#F1F3F4" stroke-width="12" />

  <!-- Google 4-Color Arcs -->
  <path d="M 256,46 A 210,210 0 0,1 466,256" fill="none" stroke="#4285F4" stroke-width="14" stroke-linecap="round" />
  <path d="M 466,256 A 210,210 0 0,1 256,466" fill="none" stroke="#34A853" stroke-width="14" stroke-linecap="round" />
  <path d="M 256,466 A 210,210 0 0,1 46,256" fill="none" stroke="#FBBC05" stroke-width="14" stroke-linecap="round" />
  <path d="M 46,256 A 210,210 0 0,1 256,46" fill="none" stroke="#EA4335" stroke-width="14" stroke-linecap="round" />

  <!-- Center Badge / Shield -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap / Ambassador Emblem -->
    <path d="M 256 140 L 380 200 L 256 260 L 132 200 Z" fill="url(#gBlue)" />
    
    <!-- Cap Base & Tassel -->
    <path d="M 180 225 L 180 290 Q 256 340 332 290 L 332 225 L 256 260 Z" fill="#1A73E8" />
    <path d="M 380 200 L 390 280 L 375 290" fill="none" stroke="#FBBC05" stroke-width="8" stroke-linecap="round" />
    <circle cx="375" cy="295" r="10" fill="#EA4335" />

    <!-- Gemini 4-Point Star Sparkle -->
    <path d="M 256 280 Q 256 340 316 340 Q 256 340 256 400 Q 256 340 196 340 Q 256 340 256 280 Z" fill="url(#gYellow)" />
    
    <!-- Inner Sparkle -->
    <circle cx="256" cy="340" r="12" fill="#34A853" />
  </g>

  <!-- 2026 Year Badge -->
  <rect x="186" y="415" width="140" height="42" rx="21" fill="#202124" />
  <text x="256" y="443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">2026</text>
</svg>
